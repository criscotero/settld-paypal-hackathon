[project]
name = "settld-engine"
version = "0.0.1"
description = "Settld Engine: verification runs, adapters, AI calls, Evidence Reports, reconciliation comparison"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "anthropic>=2.5.0",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "procrastinate>=3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pyjwt[crypto]>=2.10.1,<3",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
