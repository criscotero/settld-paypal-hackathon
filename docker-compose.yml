# Local development only. Production runs on RDS (constitution: Technology Standards).
# Copy .env.example to .env before the first `docker compose up`.
services:
  postgres:
    image: postgres:18
    # Postgres as PID 1 inherits orphaned healthcheck processes under load, and treats any of them
    # exiting non-zero as a crashed backend: it resets every connection. A real init reaps them.
    init: true
    environment:
      POSTGRES_DB: settld
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?copy .env.example to .env}
      CORE_APP_PASSWORD: ${CORE_APP_PASSWORD:?copy .env.example to .env}
      ENGINE_APP_PASSWORD: ${ENGINE_APP_PASSWORD:?copy .env.example to .env}
    ports:
      # POSTGRES_PORT lets Settld coexist with another local Postgres on 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      # Runs only when the volume is empty. After changing it: docker compose down -v
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d settld"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
